[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "map"
version = "0.1.0"
description = "Self-contained, auditable experiment tools for MAP"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2.3",
  "pandas>=2.2,<3.1",
  "pyarrow>=15,<26",
  "scipy>=1.11,<1.19",
  "torch>=2.4,<3",
  "safetensors>=0.4,<1",
  "transformers>=4.45,<6",
  "rdkit>=2023.9,<2027",
  "scikit-misc>=0.3,<0.6",
]

[project.scripts]
map = "map.cli:main"

[project.optional-dependencies]
anndata = ["anndata>=0.10,<0.14", "h5py>=3.9,<4"]
baselines = []
full = ["anndata>=0.10,<0.14", "h5py>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["."]
